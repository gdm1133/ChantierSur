<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CANARY-UNIQUE-20261011 -->
  <title>Visualiseur des Rapports PDF | ChantierSur.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1928; }
    .pdf-canvas { box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5); border-radius: 8px; margin-bottom: 24px; max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen text-slate-100 p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between pb-8 border-b border-slate-700/60 mb-8 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#0E2A47] border border-blue-400/30 rounded-xl flex items-center justify-center font-black text-white text-xl">C</div>
      <div>
        <h1 class="text-xl font-bold text-white">ChantierSur.com — Visualiseur Officiel</h1>
        <p class="text-xs text-slate-400">Rapports d'ingénierie certifiés émis par le Bureau d'études</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <button id="btn-tab-esquisse" onclick="switchDoc('esquisse')" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/20">
        📐 Étude d'Esquisse (4 pages)
      </button>
      <button id="btn-tab-audit" onclick="switchDoc('audit')" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">
        🔍 Audit de Devis (3 pages)
      </button>
    </div>
  </header>

  <!-- Controls & Download -->
  <div class="max-w-5xl mx-auto flex items-center justify-between bg-slate-900/80 backdrop-blur border border-slate-800 p-4 rounded-2xl mb-8">
    <div id="doc-meta" class="text-sm font-semibold text-slate-200">
      Chargement du document...
    </div>
    <div class="flex items-center gap-3">
      <a id="download-link" href="/ChantierSur_Esquisse_Faisabilite.pdf" download class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl flex items-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Télécharger ce PDF
      </a>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loading-spinner" class="max-w-md mx-auto text-center py-16">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
    <p class="text-sm text-slate-400">Rendu des pages vectorielles haute résolution en cours...</p>
  </div>

  <!-- PDF Render Container -->
  <main id="pdf-container" class="max-w-4xl mx-auto flex flex-col items-center">
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentDoc = 'esquisse';
    const docs = {
      esquisse: {
        url: '/ChantierSur_Esquisse_Faisabilite.pdf',
        name: 'Étude d\'Esquisse & Faisabilité Technique',
        pagesCount: '4 pages'
      },
      audit: {
        url: '/ChantierSur_Audit_Devis.pdf',
        name: 'Audit & Contre-Expertise de Devis BTP',
        pagesCount: '3 pages'
      }
    };

    async function renderPDF(url) {
      const container = document.getElementById('pdf-container');
      const spinner = document.getElementById('loading-spinner');
      spinner.classList.remove('hidden');
      container.innerHTML = '';

      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        spinner.classList.add('hidden');

        document.getElementById('doc-meta').innerHTML = `
          <span class="text-blue-400 font-bold">${docs[currentDoc].name}</span> — Document officiel (${pdf.numPages} pages)
        `;
        document.getElementById('download-link').href = url;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 2.0 });

          const wrapper = document.createElement('div');
          wrapper.className = 'w-full mb-8 flex flex-col items-center';

          const label = document.createElement('div');
          label.className = 'w-full text-left text-xs font-bold text-slate-400 mb-2 px-2 flex justify-between';
          label.innerHTML = `<span>Page ${pageNum} sur ${pdf.numPages}</span><span class="text-slate-500">ChantierSur.com</span>`;
          wrapper.appendChild(label);

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-canvas w-full';
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          wrapper.appendChild(canvas);

          const renderContext = {
            canvasContext: canvas.getContext('2d'),
            viewport: viewport
          };

          await page.render(renderContext).promise;
          container.appendChild(wrapper);
        }
      } catch (err) {
        console.error('Erreur de chargement PDF:', err);
        spinner.classList.add('hidden');
        container.innerHTML = `
          <div class="bg-rose-900/30 border border-rose-500/50 p-6 rounded-2xl text-center text-rose-300">
            <p class="font-bold text-base mb-2">Impossible de charger le document</p>
            <p class="text-xs text-rose-400 mb-4">${err.message}</p>
            <a href="${url}" download class="inline-block px-4 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl">Télécharger le PDF directement</a>
          </div>
        `;
      }
    }

    function switchDoc(type) {
      currentDoc = type;
      const btnEsq = document.getElementById('btn-tab-esquisse');
      const btnAud = document.getElementById('btn-tab-audit');

      if (type === 'esquisse') {
        btnEsq.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/20';
        btnAud.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700';
      } else {
        btnAud.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/20';
        btnEsq.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700';
      }

      renderPDF(docs[type].url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderPDF(docs.esquisse.url);
    });
  </script>
</body>
</html>

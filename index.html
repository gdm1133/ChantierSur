<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChantierSur.com - 4 Services d'Expertise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="pdf-generator.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="shield-check" class="w-7 h-7 text-amber-500"></i>
                <span class="text-xl font-black tracking-tight text-white">ChantierSur<span class="text-amber-500">.com</span></span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Tabs Selection -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <button class="tab-btn active text-left bg-slate-800/90 border-2 border-amber-500 rounded-2xl p-4 transition shadow-lg" data-target="tab-esquisse">
                <span class="font-bold text-white block">1. Esquisse & Faisabilité</span>
                <span class="text-xs text-slate-400">Phase Zéro</span>
            </button>
            <button class="tab-btn text-left bg-slate-800/60 border-2 border-transparent hover:border-slate-600 rounded-2xl p-4 transition" data-target="tab-express">
                <span class="font-bold text-white block">2. BQE Gros Œuvre Express</span>
                <span class="text-xs text-slate-400">Phase Budget</span>
            </button>
            <button class="tab-btn text-left bg-slate-800/60 border-2 border-transparent hover:border-slate-600 rounded-2xl p-4 transition" data-target="tab-audit">
                <span class="font-bold text-white block">3. Audit IA & Contre-Expertise</span>
                <span class="text-xs text-slate-400">Phase Devis</span>
            </button>
            <button class="tab-btn text-left bg-slate-800/60 border-2 border-transparent hover:border-slate-600 rounded-2xl p-4 transition" data-target="tab-finitions">
                <span class="font-bold text-white block">4. Finitions & Second Œuvre</span>
                <span class="text-xs text-slate-400">Phase Post-Gros Œuvre</span>
            </button>
        </div>

        <!-- Tab 1: Esquisse -->
        <div id="tab-esquisse" class="tab-content block">
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold text-white mb-6">Esquisse & Faisabilité</h2>
                <form id="form-esquisse" class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Zone géographique</label>
                        <select name="zone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="dakar_centre">Dakar Plateau/Almadies</option>
                            <option value="dakar_cotier">Zone Côtière/Rufisque</option>
                            <option value="interieur">Intérieur/Thiès</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Nombre de niveaux</label>
                        <select name="exact_levels" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white param-trigger">
                            <option value="0">RDC seul</option>
                            <option value="1">R+1</option>
                            <option value="2">R+2</option>
                            <option value="3">R+3</option>
                            <option value="4">R+4</option>
                            <option value="5">R+5</option>
                            <option value="6">R+6</option>
                            <option value="7">R+7</option>
                            <option value="8">R+8</option>
                            <option value="9">R+9</option>
                            <option value="10">R+10</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Configuration parcellaire</label>
                        <select name="parcel_config" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="1">En bande (1 façade)</option>
                            <option value="2">D'angle (2 façades)</option>
                            <option value="3">Traversante</option>
                            <option value="4">Isolée (4 façades)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Trame d'implantation</label>
                        <select name="structural_grid" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="eco">Économique (3.5 - 4.5m)</option>
                            <option value="standing">Grand standing (5 - 6m)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Typologie de distribution</label>
                        <select name="distribution_type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="unifamiliale">Villa unifamiliale</option>
                            <option value="locatif">Immeuble locatif par étage</option>
                            <option value="mixte">Mixte (commerces/logements)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Dimensions du terrain</label>
                        <select id="esquisse_dimension_select" name="surface_preset" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="150">Standard 150 m²</option>
                            <option value="200">Standard 200 m²</option>
                            <option value="250">Standard 250 m²</option>
                            <option value="300">Standard 300 m²</option>
                            <option value="400">Standard 400 m²</option>
                            <option value="500">Standard 500 m²</option>
                            <option value="600">Standard 600 m²</option>
                            <option value="800">Standard 800 m²</option>
                            <option value="1000">Standard 1000 m²</option>
                            <option value="custom">Terrain aux dimensions personnalisées</option>
                        </select>
                    </div>
                    <div id="custom_dimensions_block" class="hidden space-y-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm mb-1">Façade (m)</label>
                                <input type="number" id="custom_facade" min="5" max="50" step="0.5" inputmode="decimal" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white block-invalid">
                            </div>
                            <div>
                                <label class="block text-sm mb-1">Profondeur (m)</label>
                                <input type="number" id="custom_depth" min="10" max="100" step="0.5" inputmode="decimal" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white block-invalid">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1">Surface calculée (m²)</label>
                            <input type="text" id="surface_calc" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-amber-400 font-bold">
                        </div>
                        <p id="custom_error" class="text-red-500 text-sm hidden font-bold">La surface doit être comprise entre 150m² et 1000m².</p>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Croquis / Plan masse (optionnel)</label>
                        <input type="file" name="croquis_upload" accept="image/*,.pdf" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl flex items-center justify-center submit-btn">
                        Payer <span class="price-display ml-1"></span> FCFA
                    </button>
                </form>
            </div>
        </div>

        <!-- Tab 2: Express -->
        <div id="tab-express" class="tab-content hidden">
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold text-white mb-6">BQE Gros Œuvre Express</h2>
                <form id="form-express" class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Surface développée totale (m²)</label>
                        <input type="number" name="surface_dev" min="150" max="3000" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white block-invalid">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Nombre de niveaux</label>
                        <select name="exact_levels" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white param-trigger">
                            <option value="0">RDC seul</option>
                            <option value="1">R+1</option>
                            <option value="2">R+2</option>
                            <option value="3">R+3</option>
                            <option value="4">R+4</option>
                            <option value="5">R+5</option>
                            <option value="6">R+6</option>
                            <option value="7">R+7</option>
                            <option value="8">R+8</option>
                            <option value="9">R+9</option>
                            <option value="10">R+10</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Zone géographique</label>
                        <select name="zone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="dakar_centre">Dakar Plateau/Almadies</option>
                            <option value="dakar_cotier">Zone Côtière/Rufisque</option>
                            <option value="interieur">Intérieur/Thiès</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl flex items-center justify-center submit-btn">
                        Payer <span class="price-display ml-1"></span> FCFA
                    </button>
                </form>
            </div>
        </div>

        <!-- Tab 3: Audit -->
        <div id="tab-audit" class="tab-content hidden">
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold text-white mb-6">Audit IA & Contre-Expertise</h2>
                <form id="form-audit" class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Surface développée totale (m²)</label>
                        <input type="number" name="surface_dev" min="150" max="3000" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white block-invalid">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Nombre de niveaux</label>
                        <select name="exact_levels" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white param-trigger">
                            <option value="0">RDC seul</option>
                            <option value="1">R+1</option>
                            <option value="2">R+2</option>
                            <option value="3">R+3</option>
                            <option value="4">R+4</option>
                            <option value="5">R+5</option>
                            <option value="6">R+6</option>
                            <option value="7">R+7</option>
                            <option value="8">R+8</option>
                            <option value="9">R+9</option>
                            <option value="10">R+10</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Zone géographique</label>
                        <select name="zone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="dakar_centre">Dakar Plateau/Almadies</option>
                            <option value="dakar_cotier">Zone Côtière/Rufisque</option>
                            <option value="interieur">Intérieur/Thiès</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2 text-amber-500 font-bold">Devis de l'artisan (OBLIGATOIRE)</label>
                        <input type="file" name="devis_upload" accept=".pdf,image/*" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Plan d'architecte</label>
                        <input type="file" name="plan_upload" accept=".pdf,image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl flex items-center justify-center submit-btn">
                        Payer <span class="price-display ml-1"></span> FCFA
                    </button>
                </form>
            </div>
        </div>

        <!-- Tab 4: Finitions -->
        <div id="tab-finitions" class="tab-content hidden">
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold text-white mb-6">Finitions & Second Œuvre</h2>
                <form id="form-finitions" class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Surface développée totale (m²)</label>
                        <input type="number" name="surface_dev" min="150" max="3000" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white block-invalid">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Nombre de niveaux</label>
                        <select name="exact_levels" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white param-trigger">
                            <option value="0">RDC seul</option>
                            <option value="1">R+1</option>
                            <option value="2">R+2</option>
                            <option value="3">R+3</option>
                            <option value="4">R+4</option>
                            <option value="5">R+5</option>
                            <option value="6">R+6</option>
                            <option value="7">R+7</option>
                            <option value="8">R+8</option>
                            <option value="9">R+9</option>
                            <option value="10">R+10</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Niveau de standing</label>
                        <select name="finition_standing" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white">
                            <option value="standard">Standard Économique</option>
                            <option value="standing">Grand Standing Supérieur</option>
                        </select>
                    </div>
                    <div class="flex items-center mt-4">
                        <input type="checkbox" name="toiture_terrasse" id="toiture_terrasse" class="w-5 h-5 text-amber-500 bg-slate-900 border-slate-700 rounded">
                        <label for="toiture_terrasse" class="ml-2 text-sm text-white">Toiture-terrasse accessible à étancher</label>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-xl flex items-center justify-center submit-btn">
                        Payer <span class="price-display ml-1"></span> FCFA
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script>
        // Block invalid chars
        document.querySelectorAll('.block-invalid').forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (['e', 'E', '+', '-'].includes(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Tabs logic
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('border-amber-500', 'bg-slate-800/90');
                    b.classList.add('border-transparent', 'bg-slate-800/60');
                });
                btn.classList.add('border-amber-500', 'bg-slate-800/90');
                btn.classList.remove('border-transparent', 'bg-slate-800/60');
                tabContents.forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.getAttribute('data-target')).classList.remove('hidden');
                updatePrices();
            });
        });

        // Esquisse custom dimensions logic
        const presetSelect = document.getElementById('esquisse_dimension_select');
        const customBlock = document.getElementById('custom_dimensions_block');
        const customFacade = document.getElementById('custom_facade');
        const customDepth = document.getElementById('custom_depth');
        const surfaceCalc = document.getElementById('surface_calc');
        const customError = document.getElementById('custom_error');
        const esquisseBtn = document.querySelector('#form-esquisse .submit-btn');

        function updateEsquisseCustom() {
            if (presetSelect.value === 'custom') {
                customBlock.classList.remove('hidden');
                const f = parseFloat(customFacade.value) || 0;
                const d = parseFloat(customDepth.value) || 0;
                const s = f * d;
                surfaceCalc.value = s > 0 ? s : '';
                if (s > 0 && (s < 150 || s > 1000)) {
                    customError.classList.remove('hidden');
                    esquisseBtn.disabled = true;
                    esquisseBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    customError.classList.add('hidden');
                    esquisseBtn.disabled = false;
                    esquisseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            } else {
                customBlock.classList.add('hidden');
                customError.classList.add('hidden');
                esquisseBtn.disabled = false;
                esquisseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
        
        presetSelect.addEventListener('change', updateEsquisseCustom);
        customFacade.addEventListener('input', updateEsquisseCustom);
        customDepth.addEventListener('input', updateEsquisseCustom);

        // Pricing logic
        function formatMoney(amount) {
            return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        function updatePrices() {
            const forms = ['esquisse', 'express', 'audit', 'finitions'];
            const formulas = {
                'esquisse': (niv) => 35000 + (niv * 25000),
                'express': (niv) => 15000 + (niv * 12500),
                'audit': (niv) => 55000 + (niv * 45000),
                'finitions': (niv) => 25000 + (niv * 15000)
            };

            forms.forEach(service => {
                const form = document.getElementById('form-' + service);
                const nivSelect = form.querySelector('select[name="exact_levels"]');
                const niv = parseInt(nivSelect.value) || 0;
                const price = formulas[service](niv);
                const displayEl = form.querySelector('.price-display');
                if (displayEl) displayEl.textContent = formatMoney(price);
            });
        }

        document.querySelectorAll('.param-trigger').forEach(el => {
            el.addEventListener('change', updatePrices);
        });
        updatePrices();

        // Forms submission logic
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        async function handleSubmit(e, serviceType) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.submit-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = 'Traitement en cours...';
            btn.disabled = true;

            try {
                const formData = new FormData(form);
                const dataObj = Object.fromEntries(formData.entries());
                
                // Convert files to base64 for session storage
                const fileInputs = form.querySelectorAll('input[type="file"]');
                for (let input of fileInputs) {
                    if (input.files.length > 0) {
                        const file = input.files[0];
                        dataObj[input.name + '_base64'] = await fileToBase64(file);
                        dataObj[input.name + '_mime'] = file.type;
                    }
                }

                sessionStorage.setItem('cs_project_data', JSON.stringify(dataObj));

                const response = await fetch('/.netlify/functions/paytech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        serviceType: serviceType,
                        levels: dataObj.exact_levels || 0,
                        projectDetails: dataObj
                    })
                });

                const result = await response.json();
                if (result.success === 1 && result.token) {
                    window.location.href = `https://paytech.sn/payment/checkout/${result.token}`;
                } else {
                    throw new Error(result.error || 'Erreur API de paiement');
                }
            } catch (err) {
                alert('Erreur: ' + err.message);
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        document.getElementById('form-esquisse').addEventListener('submit', e => handleSubmit(e, 'esquisse'));
        document.getElementById('form-express').addEventListener('submit', e => handleSubmit(e, 'express'));
        document.getElementById('form-audit').addEventListener('submit', e => handleSubmit(e, 'audit'));
        document.getElementById('form-finitions').addEventListener('submit', e => handleSubmit(e, 'finitions'));

        // Handle fallback PDF generation on success load
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('payment') === 'success') {
                const service = urlParams.get('service') || 'express';
                let sessionData = {};
                try {
                    sessionData = JSON.parse(sessionStorage.getItem('cs_project_data') || '{}');
                } catch(e) {}
                
                // Trigger PDF Generation
                if (window.genererDossierBQE) {
                    window.genererDossierBQE(sessionData, service);
                }
            }
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
